name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  signed-release:
    # A version tag only: no PR builds or mutable branch refs can publish updates.
    if: github.repository == 'avabbbb/Yuzuki'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the release tag to be on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tags must refer to commits already on main."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
      - name: Require updater credentials and matching version; write ignored release overlay
        env:
          YUZUKI_UPDATER_PUBLIC_KEY: ${{ vars.YUZUKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/generate-release-config.mjs
      - name: Install frontend dependencies
        run: npm install
        working-directory: app
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon.png
        working-directory: app
      - name: Build installers, updater signatures and latest.json
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YUZUKI_UPDATER_PUBLIC_KEY: ${{ vars.YUZUKI_UPDATER_PUBLIC_KEY }}
          VITE_YUZUKI_UPDATER_ENABLED: "true"
          # Development / self-test releases use ad-hoc signing on macOS.
          # For frictionless public distribution, add Apple Developer ID signing
          # and notarization before publishing the draft release.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: YUZUKI ${{ github.ref_name }}
          releaseBody: "YUZUKI Desktop installers and signed in-app updates. Publish this draft only after every platform has passed."
          releaseDraft: true
          prerelease: false
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

# The updater polls GitHub's *published* latest release; draft releases
# cannot silently update installed applications.
