name: release-desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    # Platform code signing gate. Updater signatures alone do not make an
    # installer trusted by macOS Gatekeeper or Windows SmartScreen.
    if: github.repository == 'avabbbb/Yuzuki'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.gate.outputs.prerelease }}
      mac_signed: ${{ steps.gate.outputs.mac_signed }}
    steps:
      - id: gate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED: ${{ vars.YUZUKI_ALLOW_UNSIGNED }}
        run: |
          mac=false
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] && [ -n "$APPLE_ID" ] \
            && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            mac=true
          fi
          # Windows Authenticode signing is not wired into this workflow yet,
          # so a Windows installer is always unsigned until it is.
          win=false
          echo "mac_signed=$mac" >> "$GITHUB_OUTPUT"
          if [ "$mac" = true ] && [ "$win" = true ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ "$ALLOW_UNSIGNED" = "true" ]; then
            echo "::warning::Platform code signing incomplete (macOS=$mac, Windows=$win). Publishing as a prerelease: releases/latest never serves prereleases, so installed apps are not offered it."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Platform code signing incomplete (macOS=$mac, Windows=$win). Configure Apple Developer ID + notarization and Windows code signing, or set repository variable YUZUKI_ALLOW_UNSIGNED=true to build an explicit unsigned prerelease."
            exit 1
          fi

  signed-release:
    # A version tag only: no PR builds or mutable branch refs can publish updates.
    needs: preflight
    if: github.repository == 'avabbbb/Yuzuki'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - label: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the release tag to be on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release tags must refer to commits already on main."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Require updater credentials and matching version; write ignored release overlay
        env:
          YUZUKI_UPDATER_PUBLIC_KEY: ${{ vars.YUZUKI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/generate-release-config.mjs
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app
      - name: Generate platform icons
        run: npm run tauri -- icon src-tauri/icons/icon.png
        working-directory: app
      - name: Build installers, updater signatures and latest.json
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          YUZUKI_UPDATER_PUBLIC_KEY: ${{ vars.YUZUKI_UPDATER_PUBLIC_KEY }}
          VITE_YUZUKI_UPDATER_ENABLED: "true"
          # Developer ID signing + notarization when the preflight found every
          # Apple secret; otherwise ad-hoc ("-") inside an explicit prerelease.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ needs.preflight.outputs.mac_signed == 'true' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: app
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: YUZUKI ${{ github.ref_name }}
          releaseBody: "YUZUKI Desktop installers and signed in-app updates. Publish this draft only after every platform has passed. Prerelease means at least one platform installer is not code-signed."
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          retryAttempts: 3
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

# The updater polls GitHub's *published* latest release; draft releases
# cannot silently update installed applications.
