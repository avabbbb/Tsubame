[package]
name = "tsubame"
version = "0.1.0"
description = "Local-first ASMR library and AI dubbing workbench"
license = "MIT"
edition = "2021"

[lib]
name = "tsubame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }

serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
keyring = "4.2"
uuid = { version = "1", features = ["v4"] }
# PR #10 jobs/worker host input immutability + TTS cache keys (sha256).
sha2 = "0.10"
unicode-normalization = "0.1"
# WAV read/write for the offline dub mix (Apache-2.0, pure Rust, no deps).
hound = "3.5"
# Pure-Rust decode of imported media to PCM WAV (MPL-2.0; no FFmpeg, no GPL).
# Opus has no pure-Rust non-GPL decoder here: it fails with unsupported_codec.
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
