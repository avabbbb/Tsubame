[package]
name = "yuzuki-mcp"
version = "0.1.0"
description = "yuzuki-mcp: MCP stdio server for the YUZUKI Desktop control endpoint"
license = "MIT"
edition = "2021"

[lib]
name = "yuzuki_mcp"
path = "src/lib.rs"

[[bin]]
name = "yuzuki-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
yuzuki-client = { path = "../yuzuki-client" }

[dev-dependencies]
# Tests drive the real control endpoint over an in-memory fixture Desktop.
tsubame = { path = "../../app/src-tauri", features = ["test-support"] }
